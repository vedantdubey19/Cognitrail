services:
  research:
    build: .
    # Local-only service. Linux host networking or Docker Desktop host networking is required.
    network_mode: host
    env_file: .env
    environment:
      COGNITRAIL_DATABASE_URL: postgresql+psycopg://cognitrail:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@127.0.0.1:55431/cognitrail
    volumes:
      - research-data:/workspace/.runtime
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:16-alpine
    ports:
      - '127.0.0.1:55431:5432'
    environment:
      POSTGRES_DB: cognitrail
      POSTGRES_USER: cognitrail
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U cognitrail -d cognitrail']
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  research-data:
  postgres-data:
